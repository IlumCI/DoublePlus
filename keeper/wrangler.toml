# The venture ops keeper on Cloudflare Workers (needs the Workers Paid plan
# for the CPU limit below). Deploy with `npx wrangler deploy` from keeper/,
# after `npx wrangler secret put KEEPER_PRIVATE_KEY`. Logs: Workers & Pages ->
# doubleplus-keeper -> Logs, or `npx wrangler tail`.
name = "doubleplus-keeper"
main = "worker.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[triggers]
crons = ["* * * * *"]

# A run is mostly waiting on the RPC, which doesn't count, but parsing a long
# Transfer history does.
[limits]
cpu_ms = 300000

[observability]
enabled = true

[[durable_objects.bindings]]
name = "LOCK"
class_name = "RunLock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RunLock"]

# Every system on the chain, bundled as deployments.gen.json (the current
# deployment file plus the predecessors deploy-venture.ts keeps beside it);
# worker.mjs checks each matches CHAIN_ID and runs them all.
[build]
command = "node make-deployments.mjs venture-robinhood.json"

[vars]
CHAIN_ID = "4663"
# Comma-separated, the first serving and the rest stepping in for a call it
# keeps failing. Daybreak leads here: Robinhood's own RPC throttles (429)
# Cloudflare's shared egress. Daybreak serves logs 2000 blocks a query, which
# the index reads a minute (~360 blocks) of per run, catching up at most
# SYNC_MAX_BLOCKS a run after a gap.
RPC_URL = "https://robinhood.daybreak-rpc.network,https://rpc.mainnet.chain.robinhood.com,https://robinhood.drpc.org"
LOG_CHUNK = "2000"
SYNC_MAX_BLOCKS = "200000"
# Gas is ~0.02 gwei here, so a keeper tx costs ~0.000004 ETH: these allow
# ~125 txs a run and ~500 a day. Raise them as volume grows.
MAX_SPEND_ETH = "0.0005"
MAX_DAILY_SPEND_ETH = "0.002"
# Curve desk buybacks (systems with a desk): fire once a coin's buyback holds
# this much, at a random moment up to the jitter later.
BUYBACK_MIN_ETH = "0.002"
BUYBACK_JITTER_SECS = "900"

# Local testing only (`npx wrangler dev --env testnet --test-scheduled`):
# no cron, testnet contracts.
[env.testnet]
name = "doubleplus-keeper-testnet"
triggers = { crons = [] }
durable_objects.bindings = [{ name = "LOCK", class_name = "RunLock" }]
vars = { CHAIN_ID = "46630", RPC_URL = "https://rpc.testnet.chain.robinhood.com" }

[env.testnet.build]
command = "node make-deployments.mjs venture-testnet.json"
