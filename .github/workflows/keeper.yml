name: Keeper — harvest rewards

# SCHEDULE DISABLED. This keeper services deployments/quiver-v4.json, the
# oldest V4 deployment on Robinhood Chain (start block 12.74M). No current
# front end points at it — production builds target the flywheel deployment
# (see web/.env.production.local), whose keeper is the Vercel cron at
# /api/keeper. Running this every 30 minutes only burned gas.
#
# Kept as manual-dispatch rather than deleted: if quiver-v4 still has holders
# with unharvested fees, this is what pays them out. Re-enable the cron only
# if that turns out to be true.
on:
  workflow_dispatch: {} # manual runs from the Actions tab

concurrency:
  group: quiver-keeper
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install keeper deps
        working-directory: keeper
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Harvest active tokens
        working-directory: keeper
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          ROBINHOOD_RPC_URL: https://rpc.mainnet.chain.robinhood.com
        run: node keeper.mjs
