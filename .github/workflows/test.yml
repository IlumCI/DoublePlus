name: Tests

# The gate that was missing. Three separate failures accumulated unnoticed
# because nothing ran the suites on push: a test-only dependency declared in a
# non-workspace package, a vitest --exclude that never applied, and a token
# constructor that gained two parameters while eighteen call sites kept mining
# CREATE2 salts against the old ABI. All three were invisible to a green repo.
#
# Deliberately NOT gated here:
#   - `tsc --noEmit` on contracts/: 344 pre-existing errors (implicit any,
#     BaseContract property access). Hardhat runs tests transpile-only, so
#     these never block execution. Worth fixing, but not as a blocking gate
#     on day one — it would fail every PR immediately.
#   - the FORK=1 suites: they need a live Robinhood Chain RPC. See the
#     fork job below, which is manual-only until an RPC secret exists.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (hardhat)
    runs-on: ubuntu-latest
    # The venture unit + stress suites mine a CREATE2 vanity salt in JS for
    # every launch (~65k keccaks each), so the suite takes ~7 min rather than
    # the seconds the assertions themselves need.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Compile
        run: npm run compile --workspace @launchpad/contracts
      - name: Test
        run: npm test --workspace @launchpad/contracts

  web:
    name: Web (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build SDK
        run: npm run build --workspace @launchpad/sdk
      # Hermetic: *.live.test.ts is excluded, so nothing here calls out to
      # DexScreener. Run those deliberately with `npm run test:live -w web`.
      - name: Test
        run: npm test --workspace @launchpad/web

  fork:
    name: Fork tests — ${{ matrix.chain }} (manual)
    # Every *.fork.test.ts self-skips unless FORK=1, so without this job they
    # never execute anywhere — which is how the constructor-ABI drift survived
    # in nine of them.
    #
    # Two chains, because the 20 files are not all one target: 13 hardcode
    # Robinhood Chain infra (PoolManager 0x8366a39c…) and 7 hardcode Base
    # (0x498581fF…). hardhat.config.ts forks whatever ROBINHOOD_RPC_URL points
    # at regardless of the name, so a single RPC would fail one group for a
    # reason that has nothing to do with the code. Files are classified at run
    # time by which PoolManager they reference, so a new fork test lands in the
    # right group without editing this file.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        chain: [robinhood, base]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Compile once
        run: npm run compile --workspace @launchpad/contracts
      # One hardhat invocation per file, not one across all of them.
      #
      # The public RPC (https://rpc.mainnet.chain.robinhood.com) is a full node,
      # not an archive node: measured state retention is ~6-8k blocks, and the
      # chain runs ~10 blocks/sec, so a pinned fork block's state expires in
      # roughly 10-13 minutes of wall clock. Hardhat pins the fork when the run
      # starts and keeps fetching state at that block as tests touch new
      # storage, so one run across all 20 files outlives its own fork and dies
      # partway through with "historical state ... is not available" — which
      # reads like a test failure rather than an expired fork.
      #
      # Each file re-pins a fresh block and finishes well inside the window.
      # For the same reason: do NOT set BASE_FORK_BLOCK to an old block here.
      - name: Fork suite (per file)
        working-directory: contracts
        env:
          FORK: "1"
          # hardhat.config.ts reads these two for the fork url and chain id
          # whatever the target chain actually is; the names are historical.
          ROBINHOOD_RPC_URL: ${{ matrix.chain == 'base' && (secrets.BASE_RPC_URL || 'https://mainnet.base.org') || secrets.ROBINHOOD_RPC_URL }}
          ROBINHOOD_CHAIN_ID: ${{ matrix.chain == 'base' && '8453' || '4663' }}
          BASE_PM: "0x498581fF718922c3f8e6A244956aF099B2652b2b"
        run: |
          if [ -z "$ROBINHOOD_RPC_URL" ]; then
            echo "No RPC for ${{ matrix.chain }}. Set the ROBINHOOD_RPC_URL secret"
            echo "(or BASE_RPC_URL for the base leg); nothing to fork against."
            exit 1
          fi
          failed=""; ran=0
          for f in test/v4/*.fork.test.ts; do
            # Classify by the PoolManager the file pins.
            if grep -qi "$BASE_PM" "$f"; then target=base; else target=robinhood; fi
            [ "$target" = "${{ matrix.chain }}" ] || continue
            ran=$((ran+1))
            echo "::group::$f"
            if npx hardhat test --no-compile "$f"; then
              echo "PASS $f"
            else
              echo "FAIL $f"
              failed="$failed $f"
            fi
            echo "::endgroup::"
          done
          echo
          echo "ran $ran file(s) against ${{ matrix.chain }}"
          if [ "$ran" -eq 0 ]; then
            echo "No files classified for this chain — the classifier is stale."
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "Failed files:"
            for f in $failed; do echo "  $f"; done
            exit 1
          fi
          echo "All ${{ matrix.chain }} fork files passed."
