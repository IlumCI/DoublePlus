name = "doubleplus-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Public settings. Secrets (SUPABASE_SERVICE_KEY, SESSION_SECRET, LUCRE_TOKEN)
# are set with `npx wrangler secret put`, and locally in .dev.vars (gitignored).
[vars]
SUPABASE_URL = "https://fkdwbaovohfvuqcobbtl.supabase.co"
RPC_URL = "https://rpc.testnet.chain.robinhood.com"
FACTORY = "0x60e0DD86327F1dA36565c79aAe9f87070415963b"
ALLOWED_ORIGINS = "https://doubleplus.fun,https://www.doubleplus.fun,http://localhost:5173"

# The launch console. LUCRE_URL and LUCRE_TOKEN point at this launchpad's
# Lucreocracy service; the token is a secret, never a var here. LUCRE_OPERATORS
# are the wallets allowed to drive it. LUCRE_ALLOW_LIVE is off until this
# launchpad has decided the console may spend ETH, and the service's own
# per-grant budget bounds it either way. With LUCRE_URL unset the console is
# closed and says so.
LUCRE_URL = ""
LUCRE_OPERATORS = ""
LUCRE_ALLOW_LIVE = "0"

# Blocklist of abusive IPs and spent sign-in signatures, both with TTLs.
[[kv_namespaces]]
binding = "GUARD"
id = "abbb586209cf4ae995c900f2a5179eef"

# Per-IP request budgets (period is 10 or 60 seconds).
[[ratelimits]]
name = "RL_READ"
namespace_id = "2001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "2002"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "2003"
simple = { limit = 6, period = 60 }

# A launch costs ETH and minutes of LLM time, so the console gets its own
# budget rather than sharing the comment one.
[[ratelimits]]
name = "RL_LAUNCH"
namespace_id = "2004"
simple = { limit = 6, period = 60 }

# Workers Logs: the per-request JSON line, every request.
[observability]
enabled = true
head_sampling_rate = 1
