name = "doubleplus-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Served on the site's own domain; Cloudflare creates the DNS record.
routes = [{ pattern = "api.doubleplus.fun", custom_domain = true }]
workers_dev = false

# Public settings. Secrets (SUPABASE_SERVICE_KEY, SESSION_SECRET) are set with
# `npx wrangler secret put`, and locally in .dev.vars (gitignored).
[vars]
SUPABASE_URL = "https://dzqrdtgjddxaacipbbjk.supabase.co"
# Comma-separated, tried in order.
RPC_URL = "https://rpc.mainnet.chain.robinhood.com,https://robinhood.daybreak-rpc.network,https://robinhood.drpc.org"
FACTORY = "0x60e0DD86327F1dA36565c79aAe9f87070415963b"
# $DOUBLEPLUS, relaunched on Flap (web/src/venture/house.ts)
EXTRA_COINS = "0xc40f1686f7252a372ea98164dd750897f83c7777=0x6ccb0de27ed0f794073d119774ac98b1ffcd09f0"
# Local dev adds http://localhost:5173 in .dev.vars.
ALLOWED_ORIGINS = "https://doubleplus.fun,https://www.doubleplus.fun"

# Blocklist of abusive IPs and spent sign-in signatures, both with TTLs.
[[kv_namespaces]]
binding = "GUARD"
id = "abbb586209cf4ae995c900f2a5179eef"

# Per-IP request budgets (period is 10 or 60 seconds).
[[ratelimits]]
name = "RL_READ"
namespace_id = "2001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "2002"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "2003"
simple = { limit = 6, period = 60 }

# Workers Logs: the per-request JSON line, every request.
[observability]
enabled = true
head_sampling_rate = 1
