# GeckoTerminal adapter for DoublePlus curves (see worker.mjs).
# Deploy from gecko/: ../api/node_modules/.bin/wrangler deploy
name = "doubleplus-gecko"
main = "worker.mjs"
compatibility_date = "2026-09-01"

routes = [{ pattern = "gecko.doubleplus.fun", custom_domain = true }]
workers_dev = false

[vars]
# Comma-separated, tried in order. Robinhood's own RPC throttles Cloudflare, so Daybreak first.
RPC_URL = "https://robinhood.daybreak-rpc.network,https://rpc.mainnet.chain.robinhood.com,https://robinhood.drpc.org"
# eth_getLogs providers, tried in order, each "url|max blocks per query"
# (dRPC's free plan allows 10,000; Daybreak 2,000; Robinhood's own has no cap
# but throttles Cloudflare).
LOG_RPC = "https://robinhood.drpc.org|10000,https://robinhood.daybreak-rpc.network|2000,https://rpc.mainnet.chain.robinhood.com|100000"
# The second DoublePlus system (curve desk), once deployed: its factory, curve
# desk and start block from contracts/deployments/venture-robinhood.json.
# Empty = only the v1 system above is indexed.
V2_FACTORY = ""
V2_CURVE_DESK = ""
V2_START_BLOCK = ""
