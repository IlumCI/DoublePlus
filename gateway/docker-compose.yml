services:
  arc-rpc:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Optional shared secret; when set, callers must pass ?key=<value>.
      ACCESS_KEY: "${ACCESS_KEY:-}"
      # Override the onion or SOCKS if either changes.
      ONION_RPC: "${ONION_RPC:-http://t6bmjag46e5l6tb25yojjqlabzmbpjylcffyyffa5d3ghmku6m7rcrad.onion/}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "10", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
