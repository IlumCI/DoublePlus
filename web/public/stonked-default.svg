<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="stonked">
  <defs>
    <linearGradient id="sd-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16181d"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="sd-line" x1="120" y1="392" x2="392" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16a34a"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="sd-glow" cx="0.66" cy="0.34" r="0.7">
      <stop stop-color="#22c55e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#sd-bg)"/>
  <rect width="512" height="512" rx="128" fill="url(#sd-glow)"/>
  <!-- upward stonks line -->
  <path d="M116 356 L226 246 L296 316 L396 156"
