<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7e5a33"/>
      <stop offset="55%" stop-color="#5e402100"/>
    </linearGradient>
    <linearGradient id="woodBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7e5a33"/>
      <stop offset="60%" stop-color="#5e4021"/>
      <stop offset="100%" stop-color="#463018"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#1e140d"/>
  <g opacity="0.5">
    <path d="M60 0 L48 400 M140 0 L132 400 M260 0 L268 400 M340 0 L352 400" stroke="#000" stroke-opacity="0.25" stroke-width="3"/>
  </g>
  <circle cx="200" cy="190" r="175" fill="url(#glow)"/>

  <!-- lime feather rising from the slot, tilted -->
  <g transform="translate(200,196) rotate(-14)">
    <path d="M4 -172 C34 -130 32 -58 0 0 C-30 -58 -28 -130 4 -172 Z" fill="#a3e635"/>
    <path d="M4 -172 C-20 -130 -24 -58 0 0 L2 -6 C-16 -58 -14 -128 4 -172 Z" fill="#7fb322"/>
    <line x1="2" y1="-160" x2="-1" y2="6" stroke="#f0e4cb" stroke-width="7" stroke-linecap="round"/>
    <path d="M2 -34 L-17 -45 M2 -64 L-20 -76 M2 -94 L-18 -105 M2 -124 L-12 -132
             M2 -34 L20 -45 M2 -64 L23 -76 M2 -94 L21 -105 M2 -124 L15 -132"
          stroke="#3f6212" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- printer body: wooden plank -->
  <g>
    <rect x="96" y="196" width="208" height="96" rx="22" fill="url(#woodBody)"/>
    <g stroke="#000" stroke-opacity="0.16" stroke-width="3">
      <line x1="128" y1="198" x2="124" y2="290"/>
      <line x1="168" y1="198" x2="166" y2="290"/>
      <line x1="232" y1="198" x2="236" y2="290"/>
      <line x1="272" y1="198" x2="278" y2="290"/>
    </g>
    <g stroke="#fff" stroke-opacity="0.06" stroke-width="2">
      <line x1="134" y1="198" x2="130" y2="290"/><line x1="240" y1="198" x2="244" y2="290"/>
    </g>
    <rect x="96" y="196" width="208" height="8" rx="4" fill="#a37c4a" opacity="0.6"/>
    <rect x="96" y="278" width="208" height="14" rx="7" fill="#000" opacity="0.28"/>
    <rect x="96.5" y="196.5" width="207" height="95" rx="21.5" fill="none" stroke="#2c1c0c" stroke-width="3"/>
  </g>

  <!-- slot with lime trim -->
  <rect x="136" y="188" width="128" height="20" rx="8" fill="#140d04"/>
  <rect x="136" y="200" width="128" height="6" rx="3" fill="#a3e635"/>

  <!-- status light -->
  <circle cx="278" cy="262" r="9" fill="#a3e635"/>
  <circle cx="278" cy="262" r="12.5" fill="none" stroke="#a3e635" stroke-opacity="0.35" stroke-width="3"/>
</svg>
